<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Q&A Extractor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>Meet Q&A</h1>
        <p>Chat questions from your active meeting</p>
    </header>
    <main id="question-list">
        <!-- JS will populate questions here -->
    </main>
    <div class="actions">
        <button id="copy-btn" class="btn-primary">Copy All</button>
        <button id="clear-btn" class="btn-danger">Clear</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
