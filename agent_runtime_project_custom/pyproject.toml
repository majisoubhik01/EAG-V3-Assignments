[project]
name = "agent-runtime-project"
version = "0.1.0"
description = "A minimal cognitive agent runtime with persistent memory, MCP tool execution, goal-oriented perception, and artifact attachment"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["agent", "llm", "mcp", "cognitive-architecture", "asyncio"]
dependencies = [
    "ddgs>=9.14.4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "mcp>=1.27.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tavily>=1.1.0",
    "tavily-python>=0.7.24",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.27",
]
